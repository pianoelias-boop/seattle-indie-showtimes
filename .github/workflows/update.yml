name: Update showtimes

on:
  schedule:
    # 13:15 UTC is 6:15 am in Seattle during daylight time (5:15 am in winter).
    - cron: '15 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: showtimes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Scrape theaters
        run: npm run scrape

      # Committing the data keeps a history, and lets the next run fall back
      # on it for any theater whose site is down.
      - name: Save the new showtimes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/showtimes.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update showtimes $(TZ=America/Los_Angeles date +'%Y-%m-%d')"
            git pull --rebase --quiet && git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
